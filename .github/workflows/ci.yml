name: CI

on:
  pull_request:
  push:
    # `main` does not exist on this remote — the repository's only branch is
    # initial-import, so for its whole life this workflow matched nothing and
    # never ran once. Both are listed: initial-import is what is actually
    # pushed today, main stays for the day the repo is renamed/rebased onto
    # one, so this never silently goes quiet again.
    branches: [main, initial-import]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run every pre-commit hook against the full tree.
  # Covers gitleaks, detect-secrets, ruff, formatters, and the four custom
  # CT checks (no-real-secrets-in-examples, no-direct-ai-sdk,
  # camel-base-model-audit, no-dict-in-endpoint). See .pre-commit-config.yaml.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pre-commit
      # Round M ran these for the first time (`.git/hooks/pre-commit` was never
      # installed, so not one commit in this repo's history had been through
      # them). Everything that matters passes: gitleaks, detect-secrets, the
      # file checks, and all four CT architecture checks.
      #
      # Two hooks are skipped BY NAME rather than by weakening the job, so a
      # new secret or a schema that skips CamelBaseModel still fails the build:
      #   ruff-format   — would rewrite 395 of 412 backend files; the repo has
      #                   never been formatted.
      #   no-raw-colors — 994 raw Tailwind colours across the frontend; moving
      #                   them onto brand tokens can change how screens LOOK,
      #                   so it needs a human eye, not a CI commit.
      # Both are their own round. Remove a name from SKIP as its debt is paid.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-format,no-raw-colors

  backend-lint:
    runs-on: ubuntu-latest
    # Skip if the project has no backend yet (scaffold leaves pyproject.toml).
    if: hashFiles('backend/pyproject.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend (dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # BLOCKING. `ruff check` finds real defects, not style: its first run over
      # this tree (round M) reported 33, including an F821 undefined name inside
      # a test helper that round K had orphaned — dead code pytest never
      # executed and so never reported. All 33 are fixed; keep this a hard gate.
      - name: ruff lint
        working-directory: backend
        run: ruff check .
      # ADVISORY — deliberately not a gate yet, and NOT `|| true`.
      # continue-on-error still runs the step and still shows it as failed in
      # the Actions UI; it just doesn't block the merge. `|| true` would hide
      # the failure behind a green tick. Do not "tidy" this into that.
      #
      # Round M measured both. The repo has never been formatted (`ruff format
      # --check` would rewrite 395 of 412 files) and has never been type-checked
      # (94 mypy errors in 28 files, mostly **kwargs into typed constructors).
      # Neither is a correctness risk today; both are a large mechanical diff
      # that deserves its own round rather than riding along with a CI fix.
      - name: ruff format check (advisory — 395 files unformatted, round M)
        working-directory: backend
        continue-on-error: true
        run: ruff format --check .
      - name: mypy (advisory — 94 known errors, round M)
        working-directory: backend
        continue-on-error: true
        run: mypy app

  backend-test:
    runs-on: ubuntu-latest
    if: hashFiles('backend/pyproject.toml') != ''
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend (dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Enable Postgres extensions
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d test_db -c \
            'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
             CREATE EXTENSION IF NOT EXISTS "pgcrypto";
             CREATE EXTENSION IF NOT EXISTS "pg_trgm";'
      - name: pytest
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
          APP_ENV: test
        # Round M removed the scaffold's `|| true`. It was there so a fresh
        # project with no tests wouldn't start red, with a comment saying to
        # drop it "when the suite has cases". The suite has 3,296 cases, and
        # the fallback was still swallowing every one of them — a failing test,
        # a collection error, or the --cov-fail-under gate in pyproject.toml
        # would all have reported this job green.
        #
        # This job is the reason CI exists: nothing else stops a broken commit
        # from reaching UAT. It must be able to fail.
        run: pytest -q

  frontend-lint:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci || npm install
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck
      # Round M — this job lint/typecheck/built the frontend but never ran a
      # single one of its 2,051 vitest cases. They all pass in ~90s; there was
      # no reason for them to be missing beyond nobody adding the step.
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: Vite build
        working-directory: frontend
        run: npm run build

  # Build the production Dockerfiles + boot the full stack to catch the
  # Dockerfile-rot / env-loading / startup-crash class of bugs that dev's
  # native-process workflow never sees. Same compose file as
  # scripts/smoke-prod.{sh,bat} so local + CI verify identical artefact.
  docker-smoke:
    runs-on: ubuntu-latest
    if: hashFiles('docker-compose.smoke.yml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Build + start stack (waits for healthchecks)
        run: docker compose -f docker-compose.smoke.yml up -d --build --wait
      - name: Backend /health responds
        run: curl -fsS --retry 5 --retry-delay 3 http://localhost:8000/health
      - name: Frontend /health responds
        run: curl -fsS --retry 5 --retry-delay 3 http://localhost:8080/health
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.smoke.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.smoke.yml down -v --remove-orphans
