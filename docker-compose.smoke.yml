# docker-compose.smoke.yml — production-stack smoke test
#
# Purpose: build the production Dockerfiles + run the full stack locally
# (or in CI) to catch Dockerfile rot, missing deps, env-var typos, and
# start-up crashes BEFORE they reach prod.
#
# Differences from production docker-compose.yml:
#   - bundles a Postgres container (prod uses centralized DB)
#   - exposes ports on the host so curl can reach them
#   - uses bridge network (no external proxy-net required)
#   - hard-codes throwaway secrets — never use elsewhere
#
# Run:    ./scripts/smoke-prod.sh    (or scripts\smoke-prod.bat on Windows)
# CI:     .github/workflows/ci.yml job `docker-smoke`

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smoke
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d smoke"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: smoke
      APP_ENV: smoke
      APP_DEBUG: 'false'
      APP_LOG_LEVEL: INFO
      API_CORS_ORIGINS: http://localhost:8080
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: smoke
      DB_USER: smoke
      DB_PASSWORD: smoke
      JWT_SECRET_KEY: smoke-not-a-real-secret-do-not-reuse
      CLAUDE_API_KEY: ''
      AZURE_AD_TENANT_ID: ''
      AZURE_AD_CLIENT_ID: ''
      AZURE_AD_CLIENT_SECRET: ''
      REGISTRY_URL: ''
      REGISTRY_API_KEY: ''
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
