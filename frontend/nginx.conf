server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (audit finding #8).
    # CSP: SPA-friendly defaults — 'unsafe-inline' on style-src lets MUI /
    #   styled-components / Tailwind JIT inject styles; tighten per-app
    #   when you can. connect-src 'self' is exactly right here: round
    #   8-16A made the API same-origin (see the /api/ proxy below), so the
    #   app never opens a cross-origin connection and this needs no host
    #   added to it.
    # HSTS: 1 year + includeSubDomains; safe behind TLS-terminating proxy.
    #   If the proxy already sets HSTS, remove this line to avoid double-set.
    #   Browsers ignore it over plain HTTP (local prodlike), so it is inert
    #   there rather than wrong.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Upload ceiling for the inspection-photo endpoints (round 8-16A).
    # Backend allows MAX_PHOTO_COUNT=5 × MAX_PHOTO_UPLOAD_BYTES=15 MiB =
    # 75 MiB of image bytes, plus multipart boundaries/part headers and the
    # record's own form fields (well under 1 MiB). 80m keeps nginx strictly
    # ABOVE the backend's own ceiling on purpose: an oversized upload must
    # be rejected by the backend — which answers with its structured JSON
    # error — not silently by nginx with an opaque 413 HTML page.
    client_max_body_size 80m;

    # --- API: same-origin reverse proxy to the backend container ---------
    # proxy_pass has NO URI part, so the original request URI (including the
    # /api prefix) is passed through untouched — /api/v1/plots reaches the
    # backend as /api/v1/plots, which is what its routes are mounted at.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NOTE: the backend only trusts X-Forwarded-For when the peer is in
        # TRUSTED_PROXY_IPS (empty by default — see app/core/config.py). We
        # deliberately do not set that here; getting it wrong turns this
        # header into a rate-limit bypass. Until it is configured, the
        # backend rate-limits by the proxy's own address.

        # Photo uploads are re-encoded server-side (resize + WebP), which can
        # take appreciably longer than a plain JSON call. 120s covers a full
        # 5-photo batch with headroom; connect stays short because the
        # backend is one hop away on the same Docker network.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- Media: never served from the filesystem --------------------------
    # Inspection photos live under INSPECTION_PHOTOS_URL_PREFIX
    # (/media/inspection-photos/...) in the DATABASE, but that prefix is a
    # stored identifier, not a route: authorization to view a photo depends
    # on the record that owns it, so the only way to read one is the
    # authenticated GET /api/v1/records/{id}/photos/{photo_id}.
    # Without these two blocks /media/* would fall through to the SPA
    # fallback below and answer 200 + index.html — which looks like a
    # working image URL and hides the fact that nothing is authorising it.
    location ^~ /media/ { return 404; }
    location = /media   { return 404; }

    # --- Static assets ----------------------------------------------------
    # nginx only inherits add_header from an outer level when the current
    # level declares NONE of its own. Declaring any header here therefore
    # drops ALL five server-level ones for exactly the files that most need
    # them, so the full set is repeated verbatim (round 8-16A repeated four
    # of them and missed Content-Security-Policy — added round 8-16B; keep
    # this list in sync with the server block above).
    #
    # One Cache-Control, not two: `expires 1y` emits its own
    # `Cache-Control: max-age=...` alongside any add_header of the same
    # name, so the previous `expires` + `add_header` pair sent the header
    # twice. A single directive carries all three tokens unambiguously.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /health { return 200 "ok\n"; add_header Content-Type text/plain; }

    # SPA fallback — deep routes (/login, /farmlog/admin/plots, /public/inspect)
    # must survive a hard reload. Declared last so the more specific blocks
    # above always win.
    location / { try_files $uri $uri/ /index.html; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
